name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npx expo export --platform web --clear-cache

      - name: Add type=module to fix import.meta on web
        run: sed -i 's|<script src=|<script type="module" src=|' dist/index.html

      - name: Verify /teste-prover/ base path is present
        run: grep -q '/teste-prover/' dist/index.html || (echo "ERROR: base path /teste-prover/ missing in index.html" && exit 1)

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
