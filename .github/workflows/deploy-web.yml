name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npx expo export --platform web --clear-cache

      - name: Fix type=module and add SPA fallback for GitHub Pages
        run: |
          # Add type=module to script tag
          sed -i 's|<script src=|<script type="module" src=|' dist/index.html

          # Create 404.html that redirects to index.html preserving the attempted path
          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><script>
          sessionStorage.redirect = location.pathname + location.search + location.hash;
          location.replace('/teste-prover/');
          </script></head><body><a href="/teste-prover/">Redirecionando...</a></body></html>
          EOF

          # Inject SPA route restoration script before </head> in index.html
          SPA_SCRIPT='<script>!function(){var r=sessionStorage.redirect;if(r){sessionStorage.removeItem("redirect");var p=r.replace(/\\/teste-prover\\//,"/")||"/";history.replaceState(null,"",p)}}();</script>'
          sed -i "s|</head>|${SPA_SCRIPT}</head>|" dist/index.html

      - name: Verify /teste-prover/ base path is present
        run: grep -q '/teste-prover/' dist/index.html || (echo "ERROR: base path /teste-prover/ missing in index.html" && exit 1)

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
